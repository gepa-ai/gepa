---
# Release channels (see RELEASE.md):
# - Stable tag vX.Y.Z: TestPyPI, then PyPI at the exact tag version. If that exact
#   version is already on TestPyPI, build_utils/test_version.py picks a pre-release
#   for the TestPyPI rehearsal only. PyPI still gets the exact tag version and fails
#   if it already exists. After a successful publish, the release commit is merged
#   to main and main is bumped to the next patch .dev0 in the same push.
# - Pre-release tag vX.Y.ZrcN / vX.Y.ZaN / vX.Y.ZbN: TestPyPI only, at the exact tag
#   version. The PyPI job is skipped and main is not changed.
# - Any other tag, including vX.Y.Z.devN, is rejected.
# - Tags must be pushed from main, and the tagged commit must already be on main.
# - Git branch names use the original tag version.
name: Publish Python 🐍 distributions 📦 to PyPI
on:
  push:
    tags:
      - "v*"
jobs:
  extract-tag:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gepa-ai' && startsWith(github.ref, 'refs/tags/v') && github.event.base_ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.extract_tag.outputs.version }}
      channel: ${{ steps.extract_tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the main-ancestor check below is not fooled by a shallow clone.
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "Refusing to publish: $TAG_COMMIT is not on origin/main."
            exit 1
          fi
      - id: extract_tag
        name: Classify release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$VERSION" = "$TAG" ]; then
            echo "Refusing to publish: tag $TAG must start with v."
            exit 1
          fi
          CHANNEL=$(python3 .github/workflows/build_utils/release_channel.py classify "$VERSION")
          if [ "$CHANNEL" != "stable" ] && [ "$CHANNEL" != "prerelease" ]; then
            echo "Refusing to publish tag $TAG (classified as $CHANNEL)."
            echo "Stable tags are vX.Y.Z. Pre-release tags are vX.Y.ZrcN, vX.Y.ZaN, or vX.Y.ZbN."
            echo "Dev versions stay on main and are not published."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG classified as $CHANNEL"

  verify-ci:
    name: Run CI for release
    needs: extract-tag
    if: github.repository_owner == 'gepa-ai' && startsWith(github.ref, 'refs/tags/v') && github.event.base_ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/run_tests.yml

  build-and-publish-test-pypi:
    needs: [extract-tag, verify-ci]
    if: github.repository_owner == 'gepa-ai' && startsWith(github.ref, 'refs/tags/v') && github.event.base_ref == 'refs/heads/main' && (needs.extract-tag.outputs.channel == 'stable' || needs.extract-tag.outputs.channel == 'prerelease')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PUSH_KEY }}
      - name: Configure git
        run: |
          git config --global user.email "lakshyaaagrawal+gepabot@berkeley.edu"
          git config --global user.name "gepa-bot"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up latest uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Create virtual environment
        run: uv venv
      - name: Install build dependencies
        run: uv pip install ".[build]"
      - name: Resolve TestPyPI version
        id: check_version
        env:
          RELEASE_VERSION: ${{ needs.extract-tag.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.extract-tag.outputs.channel }}
        run: |
          PACKAGE_NAME="gepa"
          if [ "$RELEASE_CHANNEL" = "prerelease" ]; then
            # RC tag version == TestPyPI version. Do not invent a parallel bump.
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://test.pypi.org/pypi/$PACKAGE_NAME/$RELEASE_VERSION/json")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Version $RELEASE_VERSION already exists on TestPyPI."
              echo "Cut the next pre-release tag instead of republishing this one."
              exit 1
            elif [ "$HTTP_STATUS" != "404" ]; then
              echo "Unable to check TestPyPI (HTTP $HTTP_STATUS); refusing to publish $RELEASE_VERSION."
              exit 1
            fi
            NEW_VERSION="$RELEASE_VERSION"
          elif [ "$RELEASE_CHANNEL" = "stable" ]; then
            echo "Checking if $RELEASE_VERSION for $PACKAGE_NAME exists on TestPyPI"
            NEW_VERSION=$(uv run python .github/workflows/build_utils/test_version.py "$PACKAGE_NAME" "$RELEASE_VERSION" https://test.pypi.org)
          else
            echo "Refusing TestPyPI publish for $RELEASE_VERSION ($RELEASE_CHANNEL)."
            exit 1
          fi
          if [ -z "$NEW_VERSION" ] || [ "$NEW_VERSION" = "None" ]; then
            echo "Failed to resolve a TestPyPI version for $RELEASE_VERSION"
            exit 1
          fi
          echo "Version to be used for TestPyPI release: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Update version in pyproject.toml and refresh lockfile
        run: |
          sed -i '/#replace_package_version_marker/{n;s/version="[^"]*"/version="${{ steps.check_version.outputs.version }}"/;}' pyproject.toml
          # Keep uv.lock in sync with the bumped version. A stale lock breaks
          # `uv sync --locked` in CI, and with a plain `uv sync` it silently
          # re-resolves against latest PyPI (which is how an unbuildable
          # litellm 1.92.0 reached the Python 3.14 jobs after the 0.1.2 bump).
          uv lock
      - name: Build a binary wheel
        run: uv run python -m build
      - name: List built distributions
        run: ls -la dist/
      - name: Show package metadata
        run: uv run python -c "import build; print(build.__version__)"
      # Test the locally built wheel
      - name: Create test environment
        run: uv venv test_before_testpypi
      - name: Test package installation and functionality
        run: |
          # Install the locally built wheel and testing dependencies
          WHEEL_FILE=$(ls dist/*.whl | head -1)
          uv pip install --python test_before_testpypi/bin/python "$WHEEL_FILE[dev]" pytest
          # Use the wheel environment without syncing the source checkout into it
          VIRTUAL_ENV="$PWD/test_before_testpypi" uv run --active --no-sync pytest tests/
      # Publish to test-PyPI
      - name: Publish distribution 📦 to test-PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # This requires a trusted publisher to be setup in pypi/testpypi
        with:
          repository-url: https://test.pypi.org/legacy/

      # Create and push to release-test branch (no merge to main)
      - name: Create release-test branch and push changes
        run: |
          git checkout -b release-test-${{ needs.extract-tag.outputs.version }}
          git add pyproject.toml uv.lock
          git commit -m "Update version to ${{ steps.check_version.outputs.version }} for test PyPI (from tag ${{ needs.extract-tag.outputs.version }})"
          git push origin release-test-${{ needs.extract-tag.outputs.version }}

  # TODO: Add tests using gepa

  build-and-publish-pypi:
    needs: [extract-tag, build-and-publish-test-pypi]
    # Stable vX.Y.Z tags only. Pre-release tags skip this job entirely, so they
    # cannot publish to PyPI or move the version on main.
    if: github.repository_owner == 'gepa-ai' && startsWith(github.ref, 'refs/tags/v') && github.event.base_ref == 'refs/heads/main' && needs.extract-tag.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PUSH_KEY }}
          fetch-depth: 0
      - name: Configure git
        run: |
          git config --global user.email "lakshyaaagrawal+gepabot@berkeley.edu"
          git config --global user.name "gepa-bot"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up latest uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Create virtual environment
        run: uv venv
      - name: Install build dependencies
        run: uv pip install ".[build]"
      - name: Set version for PyPI release (always use tag version)
        id: check_version
        env:
          RELEASE_VERSION: ${{ needs.extract-tag.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.extract-tag.outputs.channel }}
        run: |
          PACKAGE_NAME="gepa"
          CHANNEL=$(python3 .github/workflows/build_utils/release_channel.py classify "$RELEASE_VERSION")
          if [ "$RELEASE_CHANNEL" != "stable" ] || [ "$CHANNEL" != "stable" ]; then
            echo "Refusing PyPI publish for non-stable version $RELEASE_VERSION ($RELEASE_CHANNEL / $CHANNEL)."
            exit 1
          fi
          echo "Using exact tag version for PyPI release: $RELEASE_VERSION"

          # Check if this exact version already exists on PyPI
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE_NAME/$RELEASE_VERSION/json")
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "Version $RELEASE_VERSION does not exist on PyPI, proceeding..."
          elif [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $RELEASE_VERSION already exists on PyPI!"
            echo "Please create a new tag with a different version number."
            exit 1
          else
            echo "Unable to check PyPI (HTTP $HTTP_STATUS), proceeding with caution..."
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Update version in pyproject.toml and refresh lockfile
        run: |
          sed -i '/#replace_package_version_marker/{n;s/version="[^"]*"/version="${{ steps.check_version.outputs.version }}"/;}' pyproject.toml
          # Keep uv.lock in sync with the bumped version. A stale lock breaks
          # `uv sync --locked` in CI, and with a plain `uv sync` it silently
          # re-resolves against latest PyPI (which is how an unbuildable
          # litellm 1.92.0 reached the Python 3.14 jobs after the 0.1.2 bump).
          uv lock
      - name: Build a binary wheel
        run: uv run python -m build
      # Test the locally built wheel before publishing to pypi
      - name: Create test environment
        run: uv venv test_before_pypi
      - name: Test package installation and functionality
        run: |
          # Install the locally built wheel and testing dependencies
          WHEEL_FILE=$(ls dist/*.whl | head -1)
          uv pip install --python test_before_pypi/bin/python "$WHEEL_FILE[dev]" pytest
          # Use the wheel environment without syncing the source checkout into it
          VIRTUAL_ENV="$PWD/test_before_pypi" uv run --active --no-sync pytest tests/
          rm -r test_before_pypi
      - name: Publish distribution 📦 to PyPI (gepa)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false

      # Create and push to release branch
      - name: Create release branch and push changes
        run: |
          git checkout -b release-${{ needs.extract-tag.outputs.version }}
          git add pyproject.toml uv.lock
          git commit -m "Update version to ${{ steps.check_version.outputs.version }} (from tag ${{ needs.extract-tag.outputs.version }})"
          git push origin release-${{ needs.extract-tag.outputs.version }}

      # Merge the frozen stable version, then bump main to the next patch .dev0
      # before the single push. A failure here leaves origin/main untouched.
      - name: Merge release to main and open the next dev version
        env:
          RELEASE_VERSION: ${{ needs.extract-tag.outputs.version }}
        run: |
          NEXT_DEV=$(python3 .github/workflows/build_utils/release_channel.py next-dev "$RELEASE_VERSION")
          git checkout main
          git pull origin main
          git merge --no-ff "release-${RELEASE_VERSION}" -m "Merge release ${RELEASE_VERSION}"
          sed -i '/#replace_package_version_marker/{n;s/version="[^"]*"/version="'"${NEXT_DEV}"'/;}' pyproject.toml
          python3 .github/workflows/build_utils/release_channel.py check-marker pyproject.toml "$NEXT_DEV"
          uv lock
          git add pyproject.toml uv.lock
          git commit -m "Bump version to ${NEXT_DEV} after ${RELEASE_VERSION}"
          git push origin main
