name: Lint, Test, and Build
permissions:
  contents: read

on:
  push:
    branches: [main, release-*]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

jobs:
  fix:
    name: Check Ruff Fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Create and activate virtual environment
        run: |
          uv venv .venv --python 3.11
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync -p .venv --locked --extra dev
      - name: Ruff Check
        run: |
          uv run -p .venv ruff check --fix-only --diff --exit-non-zero-on-fix || (
            echo ""
            echo "❌ Ruff found issues that can be fixed automatically."
            echo "💡 To fix them locally, run:"
            echo ""
            echo "    pre-commit run --all-files"
            echo ""
            echo "Then commit and push the changes."
            exit 1
          )

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv with caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Create and activate virtual environment
        run: |
          uv venv .venv --python 3.11
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync -p .venv --locked --extra dev
      - name: Run Pyright
        run: uv run -p .venv pyright

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv with caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          uv sync -p .venv --locked --extra dev
          uv pip list
      - name: Run lint with tests
        run: uv run -p .venv ruff check
      - name: Run tests with pytest
        run: uv run -p .venv pytest -vv tests/
      # - name: Install optional dependencies
      #   run: uv sync -p .venv --locked --extra dev --extra test_extras
      # - name: Run extra tests
      #   run: uv run -p .venv pytest tests/ -m extra --extra

  # rpc_test, rpc_typescript_test and rpc_rust_test moved to
  # run_rpc_tests.yml -- see that file's header for why. This workflow is
  # what build_and_release.yml's verify-ci gate calls before every core
  # PyPI release, so it must stay free of the npm/apt/cargo toolchains.

  build_package:
    name: Build Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv with caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync -p .venv --locked --extra dev
      - name: Build
        run: uv run -p .venv python -m build
      - name: Install built package (wheel only, no rpc extra)
        run: uv pip install "$(ls dist/*.whl)[dev]" -p .venv
      - name: Test import gepa
        run: uv run -p .venv python -c "import gepa"
      # Proves the artifact that actually ships to PyPI -- not just the source
      # checkout -- installs and tests clean with zero dependency on npm,
      # cargo, apt or the rpc extra. The --ignore flags are
      # belt-and-suspenders: the rpc tests already self-skip via
      # pytest.importorskip("grpc") since this venv never installs the rpc
      # extra, but excluding them explicitly keeps this release-gating job
      # from ever implicitly depending on rpc.
      - name: Run tests against the installed wheel
        run: >-
          uv run -p .venv pytest -vv tests/
          --ignore=tests/test_rpc_integration.py
          --ignore=tests/test_rpc_e2e
      # Ensure gepa[dspy] does not bring in new packages
      - name: Install dependencies
        run: |
          uv run --isolated --extra dspy python tests/ensure_gepa_dspy_dependency.py
