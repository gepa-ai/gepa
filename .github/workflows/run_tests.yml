  build_package:
    name: Build Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv with caching
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync -p .venv --locked --extra dev
      - name: Build
        run: uv run -p .venv python -m build
      - name: Install built package (wheel only, no rpc extra)
        run: uv pip install "$(ls dist/*.whl)[dev]" -p .venv
      # Everything below invokes .venv/bin/python directly rather than
      # `uv run`. `uv run` re-syncs the project environment first, which
      # reinstalls gepa from the source tree and silently replaces the wheel
      # just installed -- so `uv run python -c "import gepa"` imports
      # src/gepa, not the artifact under test. (dependency_canary.yml avoids
      # `uv run` for the same reason, and build_and_release.yml uses
      # `uv run --active --no-sync`.)
      - name: Verify the import really comes from the installed wheel
        run: |
          .venv/bin/python - <<'PY'
          import pathlib, sys
          # Put the repo root on sys.path first, which is what pytest's default
          # "prepend" import mode does for tests/. The project is src-layout, so
          # there is no importable `gepa/` at the root and the installed wheel
          # must still win -- assert that rather than assuming it.
          sys.path.insert(0, str(pathlib.Path(".").resolve()))
          import gepa
          imported = pathlib.Path(gepa.__file__).resolve()
          workspace = pathlib.Path(".").resolve()
          print(f"gepa imported from: {imported}")
          if workspace in imported.parents:
              raise SystemExit(
                  f"FAIL: gepa resolved to the source checkout under {workspace}, "
                  "not the installed wheel -- this job is not testing the "
                  "release artifact."
              )
          print("OK: importing the installed wheel, not the source tree")
          PY
      # Proves the artifact that actually ships to PyPI -- not just the source
      # checkout -- installs and tests clean with zero dependency on npm,
      # cargo, apt or the rpc extra. The --ignore flags are
      # belt-and-suspenders: the rpc tests already self-skip via
      # pytest.importorskip("grpc") since this venv never installs the rpc
      # extra, but excluding them explicitly keeps this release-gating job
      # from ever implicitly depending on rpc.
      - name: Run tests against the installed wheel
        run: >-
          .venv/bin/python -m pytest -vv tests/
          --ignore=tests/test_rpc_integration.py
          --ignore=tests/test_rpc_e2e
      # Ensure gepa[dspy] does not bring in new packages
      - name: Install dependencies
        run: |
          uv run --isolated --extra dspy python tests/ensure_gepa_dspy_dependency.py
